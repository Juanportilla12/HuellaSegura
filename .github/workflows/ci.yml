# Integración continua: en cada push o pull request a main se verifica que el
# proyecto compile, cumpla el estilo de código y pase todas sus pruebas.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          NODE_ENV: test

  frontend:
    name: Frontend (lint + pruebas + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  e2e:
    name: Extremo a extremo (MySQL real)
    runs-on: ubuntu-latest
    needs: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: huella_segura_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: huella_segura_ci
      DB_USER: root
      DB_PASSWORD: ci_root
      JWT_SECRET: secreto-solo-para-ci-no-usar-en-produccion
      FRONTEND_URL: http://localhost:5173
      # Servicios externos inexistentes: los correos y subidas fallan sin bloquear el flujo
      EMAIL_HOST: 127.0.0.1
      EMAIL_PORT: 1
      EMAIL_USER: ci@test.local
      EMAIL_PASS: x
      CLOUDINARY_CLOUD_NAME: x
      CLOUDINARY_API_KEY: x
      CLOUDINARY_API_SECRET: x
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Migraciones desde cero
        run: npm run migrate
      - name: Revertir y reaplicar todas las migraciones
        run: npx sequelize-cli db:migrate:undo:all && npm run migrate
      - name: Iniciar la API
        run: |
          node server.js > servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3001/health && exit 0; sleep 1; done
          cat servidor.log; exit 1
      - name: Prueba de extremo a extremo
        run: npm run test:e2e
        env:
          E2E_API_URL: http://localhost:3001/api
